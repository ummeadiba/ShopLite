name: Deploy Pages

# Publishes two things to one site:
#   /                 the docs (from docs/, generated by tools/build-docs.js)
#   /app/login.html   the system under test (from app/, copied verbatim)
#
# Requires: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Never publish pages that no longer match their Markdown sources.
      - name: docs/ matches the Markdown sources
        run: node tools/build-docs.js --check

      - name: assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/app
          cp -r app/. _site/app/

          # A fake login form in search results is how a training fixture ends up
          # on a phishing blocklist. app/ is never edited in the repository, so
          # the tag is injected into the published copy only.
          node -e '
            const fs = require("fs");
            const dir = "_site/app";
            const tag = "\n<meta name=\"robots\" content=\"noindex, nofollow\">";
            for (const f of fs.readdirSync(dir).filter(n => n.endsWith(".html"))) {
              const p = dir + "/" + f;
              const html = fs.readFileSync(p, "utf8");
              if (html.includes("name=\"robots\"")) continue;
              fs.writeFileSync(p, html.replace("<head>", "<head>" + tag));
              console.log("noindex -> " + p);
            }
          '

          test -f _site/index.html
          test -f _site/candidate-brief.html
          test -f _site/product-spec.html
          test -f _site/assets/docs.css
          test -f _site/app/login.html
          test -f _site/app/assets/app.js
          test -f _site/.nojekyll
          grep -q 'name="robots"' _site/app/login.html

          # The API has real server-side state and no rate limiting. It is local-only
          # by design and must never reach the published site. See SECURITY.md.
          test ! -e _site/mock-api
          test ! -e _site/load-test

      # enablement: turns Pages on with this workflow as the source if it is not
      # configured yet, so no manual Settings visit is needed on a fresh repo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
